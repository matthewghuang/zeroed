services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: zeroed
      POSTGRES_USER: zeroed
      POSTGRES_PASSWORD: devpassword
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeroed -d zeroed"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
      - maven_cache:/root/.m2
    ports:
      - "8080:8080"
    environment:
      DB_URL: postgresql://db:5432/zeroed
      DB_USERNAME: zeroed
      DB_PASSWORD: devpassword
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:8080
    depends_on:
      - backend

volumes:
  postgres_data:
  maven_cache:
  frontend_modules:
